<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b4f9c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#152035" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved Light/Dark choice before the page paints (see src/components/ThemeToggle.jsx).
      try {
        var theme = localStorage.getItem('theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <meta name="description" content="Interactive gym floor map prototype for students: find machines, muscles worked and how-to videos." />
    <title>Dottie Dorion Fitness Center Map (Draft) · UNF SWC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
